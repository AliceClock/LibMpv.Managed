name: Build and release preview packages

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate a build, stage verified packages on GitHub, or publish staged packages to NuGet.org
        type: choice
        options: [validate, stage, publish]
        default: validate

permissions:
  contents: read

concurrency:
  group: libmpv-managed-release
  cancel-in-progress: false

jobs:
  native:
    if: inputs.operation != 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Build locked LGPL Windows runtime
        run: |
          mkdir -p .artifacts/native
          bash native/bootstrap.sh
          docker run --rm --mount "type=bind,source=$PWD/native,target=/recipe,readonly" \
            --mount "type=bind,source=$PWD/.artifacts/native,target=/out" libmpv-managed-build:0.42.0
      - name: Rebuild offline using the corresponding source archive
        run: |
          mkdir -p .artifacts/rebuilt
          docker run --rm --network=none --mount "type=bind,source=$PWD/native,target=/recipe,readonly" \
            --mount "type=bind,source=$PWD/.artifacts/native,target=/input,readonly" \
            --mount "type=bind,source=$PWD/.artifacts/rebuilt,target=/out" libmpv-managed-build:0.42.0
          cmp .artifacts/native/corresponding-source.tar.xz .artifacts/rebuilt/corresponding-source.tar.xz
          cmp .artifacts/native/runtime/libmpv-2.dll .artifacts/rebuilt/runtime/libmpv-2.dll
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: .artifacts/native/*
          if-no-files-found: error

  pack-and-verify:
    needs: native
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: native
          path: .artifacts/native
      - name: Validate the packages in a separate Win64 project
        shell: pwsh
        run: |
          $runtime = ./scripts/Get-UpstreamRuntime.ps1
          ./scripts/New-TestDlls.ps1
          $env:MPV_WRONG_ARCH_DLL = (Resolve-Path .artifacts/shims/x86.dll).Path
          $env:MPV_OLD_API_DLL = (Resolve-Path .artifacts/shims/x64.dll).Path
          dotnet pack src/LibMpv.Managed -c Release -o .artifacts/feed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Pack-Native.ps1 -Artifacts .artifacts/native -Output .artifacts/feed
          ./scripts/Test-Packages.ps1 -Source .artifacts/feed -OverrideDll $runtime -AdditionalSources https://api.nuget.org/v3/index.json
      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: .artifacts/feed/*
          if-no-files-found: error

  stage:
    if: inputs.operation == 'stage' && github.repository == 'AliceClock/LibMpv.Managed' && github.ref == 'refs/heads/main'
    needs: pack-and-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native
          path: artifacts/native
      - uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: artifacts/release
      - name: Publish reviewed packages and corresponding source on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as x; print(x.parse("native/package/LibMpv.Managed.Native.WinX64.csproj").findtext(".//Version"))')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
          (
            cd artifacts/native
            sha256sum -c corresponding-source.tar.xz.sha256
            tar -czf ../release/build-records.tar.gz runtime.sha256 pe.txt config.h config.log meson-log.txt toolchain-packages.tsv sources.lock.tsv
            cp corresponding-source.tar.xz corresponding-source.tar.xz.sha256 ../release/
          )
          (
            cd artifacts/release
            sha256sum *.nupkg *.snupkg corresponding-source.tar.xz corresponding-source.tar.xz.sha256 build-records.tar.gz > SHA256SUMS
          )
          gh release create "native-v$version" --target "$GITHUB_SHA" --prerelease --title "LibMpv.Managed Windows x64 preview" \
            --notes 'Verified Win64 NuGet packages and corresponding source for the LGPL runtime.' artifacts/release/*

  publish:
    if: inputs.operation == 'publish' && github.repository == 'AliceClock/LibMpv.Managed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify staged release and package checksums
        id: approved
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          read_version() {
            python3 -c 'import sys, xml.etree.ElementTree as x; print(x.parse(sys.argv[1]).findtext(".//Version"))' "$1"
          }
          native=$(read_version native/package/LibMpv.Managed.Native.WinX64.csproj)
          managed=$(read_version src/LibMpv.Managed/LibMpv.Managed.csproj)
          [[ "$native" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
          [[ "$managed" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
          gh release download "native-v$native" --pattern '*' --dir artifacts/release
          cd artifacts/release
          sha256sum -c SHA256SUMS
          sha256sum -c corresponding-source.tar.xz.sha256
          native_file="LibMpv.Managed.Native.WinX64.$native.nupkg"
          managed_file="LibMpv.Managed.$managed.nupkg"
          grep -Fq "  $native_file" SHA256SUMS
          grep -Fq "  $managed_file" SHA256SUMS
          echo "native=$native_file" >> "$GITHUB_OUTPUT"
          echo "managed=$managed_file" >> "$GITHUB_OUTPUT"
      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push verified packages
        env:
          NATIVE_PACKAGE: ${{ steps.approved.outputs.native }}
          MANAGED_PACKAGE: ${{ steps.approved.outputs.managed }}
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          for package in "$NATIVE_PACKAGE" "$MANAGED_PACKAGE"; do
            dotnet nuget push "artifacts/release/$package" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  public-restore:
    needs: publish
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify public index and run installed packages
        shell: pwsh
        run: |
          $managed = ([xml](Get-Content src/LibMpv.Managed/LibMpv.Managed.csproj -Raw)).Project.PropertyGroup.Version
          $native = ([xml](Get-Content native/package/LibMpv.Managed.Native.WinX64.csproj -Raw)).Project.PropertyGroup.Version
          $deadline = [DateTime]::UtcNow.AddMinutes(10)
          foreach ($package in @{ 'libmpv.managed' = $managed; 'libmpv.managed.native.winx64' = $native }.GetEnumerator()) {
            while ($true) {
              try {
                $uri = "https://api.nuget.org/v3-flatcontainer/$($package.Key)/index.json"
                $index = Invoke-RestMethod -Uri $uri -TimeoutSec 15
                if ($index.versions -contains $package.Value) { break }
              } catch { Write-Host "Waiting for $($package.Key) in the public index." }
              if ([DateTime]::UtcNow -ge $deadline) { throw "NuGet did not index $($package.Key) $($package.Value)." }
              Start-Sleep -Seconds 10
            }
          }
          ./scripts/Test-Packages.ps1 -Source https://api.nuget.org/v3/index.json
