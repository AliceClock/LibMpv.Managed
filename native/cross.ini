[binaries]
c = 'x86_64-w64-mingw32-gcc-posix'
cpp = 'x86_64-w64-mingw32-g++-posix'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
dlltool = 'x86_64-w64-mingw32-dlltool'
pkg-config = 'pkg-config'
nasm = 'nasm'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = '/work/prefix/lib/pkgconfig'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
c_link_args = ['-static-libgcc', '-static-libstdc++', '-Wl,-Bstatic']
cpp_link_args = ['-static-libgcc', '-static-libstdc++', '-Wl,-Bstatic']
